name: CI

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libpq-dev libpqxx-dev

      - name: Configure (tests ON)
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests (if enabled)
        run: |
          cd build
          ctest --output-on-failure
